<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>גריד פריימים מתקדם - FreeTV</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 0 15px 15px 15px; }
        
        /* תפריט ננעץ בראש המסך */
        .controls { 
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex; 
            gap: 10px; 
            justify-content: center;
            align-items: center; 
            padding: 12px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #334155;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .field-group { display: flex; align-items: center; gap: 4px; font-size: 13px; color: #94a3b8; }
        
        select, input, button { padding: 6px 8px; border-radius: 4px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 13px; }
        button { background: #3b82f6; cursor: pointer; border: none; font-weight: bold; padding: 6px 14px; }
        button:hover { background: #2563eb; }
        
        /* גריד בעל 12 עמודות קבועות */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(12, 1fr); 
            gap: 6px; 
            scroll-margin-top: 70px; /* מרווח לגלילה מדויקת אל מתחת לתפריט הנעוץ */
        }
        
        .item { text-align: center; scroll-margin-top: 70px; }
        .time { font-size: 10px; font-weight: bold; color: #94a3b8; margin-bottom: 2px; }
        
        .box { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background-color: #1e293b; 
            background-repeat: no-repeat;
            background-size: 100% auto;
            border-radius: 4px; 
            display: block; 
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .box.loading { background-color: #334155; }
        .box.error { background-color: #7f1d1d; }

        /* מיקומי Sprite Sheet לפי שניות */
        .box.f-00 { background-position: center 0%; }
        .box.f-10 { background-position: center 20%; }
        .box.f-20 { background-position: center 40%; }
        .box.f-30 { background-position: center 60%; }
        .box.f-40 { background-position: center 80%; }
        .box.f-50 { background-position: center 100%; }
    </style>
</head>
<body>

<div class="controls">
    <div class="field-group">
        <label for="channel">ערוץ:</label>
        <select id="channel">
            <option value="kan11_hevc">כאן 11</option>
            <option value="keshet_12_hevc" selected>קשת 12</option>
            <option value="reshet_13_hevc">רשת 13</option>
            <option value="ch14_hevc">עכשיו 14</option>
            <option value="i24_he">i24NEWS</option>
        </select>
    </div>

    <div class="field-group">
        <label for="interval">תדירות:</label>
        <select id="interval">
            <option value="10">כל 10 שניות</option>
            <option value="30" selected>כל 30 שניות</option>
            <option value="60">כל 60 שניות</option>
        </select>
    </div>

    <div class="field-group">
        <label for="date">תאריך:</label>
        <input type="date" id="date">
    </div>

    <div class="field-group">
        <label for="startTime">התחלה:</label>
        <input type="time" id="startTime" value="06:00">
    </div>

    <div class="field-group">
        <label for="endTime">סיום:</label>
        <input type="time" id="endTime" value="00:00">
    </div>

    <button id="loadBtn">טען</button>

    <div class="field-group" style="margin-right: 10px; border-right: 1px solid #334155; padding-right: 10px;">
        <label for="jumpTo">קפיצה לשעה:</label>
        <select id="jumpTo">
            <!-- קפנדריות ייווצרו דינמית לפי השעות שנבחרו -->
        </select>
    </div>
</div>

<div class="grid" id="grid"></div>

<script>
(function() {
    var EXACT_ANCHOR_TIME = 811566730000 + 10000; 
    var EXACT_ANCHOR_DATE = new Date(2026, 8, 20, 6, 11, 0);

    var dateInput = document.getElementById('date');
    if (dateInput) {
        var today = new Date();
        var yyyy = today.getFullYear();
        var mm = String(today.getMonth() + 1).padStart(2, '0');
        var dd = String(today.getDate()).padStart(2, '0');
        dateInput.value = yyyy + '-' + mm + '-' + dd;
    }

    var jumpSelect = document.getElementById('jumpTo');

    // גלילה מדויקת לראש המסך (מתחת לתפריט הנעוץ)
    jumpSelect.onchange = function() {
        var targetTime = this.value;
        var el = document.getElementById('time-' + targetTime + ':00');
        if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    };

    var queue = [];
    var activeWorkerCount = 0;
    var MAX_CONCURRENT_WORKERS = 2;
    var loadedUrlsCache = {};

    function processQueue() {
        if (activeWorkerCount >= MAX_CONCURRENT_WORKERS || queue.length === 0) return;

        queue.sort(function(a, b) {
            var rectA = a.box.getBoundingClientRect();
            var rectB = b.box.getBoundingClientRect();
            
            if (Math.abs(rectA.top - rectB.top) > 15) {
                return rectA.top - rectB.top;
            }
            return rectB.right - rectA.right;
        });

        activeWorkerCount++;
        var task = queue.shift();
        var box = task.box;
        var url = task.url;

        if (!task.isIntersecting && !loadedUrlsCache[url]) {
            activeWorkerCount--;
            processQueue();
            return;
        }

        box.classList.add('loading');

        if (loadedUrlsCache[url]) {
            box.style.backgroundImage = 'url("' + url + '")';
            box.classList.remove('loading');
            activeWorkerCount--;
            processQueue();
            return;
        }

        var img = new Image();
        img.onload = function() {
            loadedUrlsCache[url] = true;
            box.style.backgroundImage = 'url("' + url + '")';
            box.classList.remove('loading');
            activeWorkerCount--;
            processQueue();
        };

        img.onerror = function() {
            task.retryCount = (task.retryCount || 0) + 1;
            if (task.retryCount <= 3) {
                setTimeout(function() {
                    queue.push(task);
                    activeWorkerCount--;
                    processQueue();
                }, 500);
            } else {
                box.classList.remove('loading');
                box.classList.add('error');
                activeWorkerCount--;
                processQueue();
            }
        };

        img.src = url;
    }

    var imageObserver = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            var box = entry.target;
            var url = box.dataset.src;

            if (!url) return;

            if (entry.isIntersecting) {
                var existingIndex = queue.findIndex(function(t) { return t.box === box; });
                if (existingIndex !== -1) queue.splice(existingIndex, 1);

                queue.push({ box: box, url: url, isIntersecting: true });
                processQueue();
            } else {
                var task = queue.find(function(t) { return t.box === box; });
                if (task) {
                    task.isIntersecting = false;
                }
            }
        });
    }, {
        rootMargin: '50px 0px'
    });

    function updateJumpOptions(startDate, endDate) {
        jumpSelect.innerHTML = '';
        var current = new Date(startDate.getTime());
        
        // יצירת אפשרויות קפיצה בכל 30 דקות בתוך הטווח הנבחר
        while (current < endDate) {
            var hStr = String(current.getHours()).padStart(2, '0');
            var mStr = String(current.getMinutes()).padStart(2, '0');
            var timeVal = hStr + ':' + mStr;

            var opt = document.createElement('option');
            opt.value = timeVal;
            opt.textContent = timeVal;
            jumpSelect.appendChild(opt);

            current.setMinutes(current.getMinutes() + 30);
        }

        if (jumpSelect.options.length > 0) {
            jumpSelect.selectedIndex = 0; // ברירת המחדל היא שעת ההתחלה
        }
    }

    function runGrid() {
        var grid = document.getElementById('grid');
        var channel = document.getElementById('channel').value;
        var intervalSec = parseInt(document.getElementById('interval').value, 10);
        var selectedDateVal = dateInput.value;
        var startTimeVal = document.getElementById('startTime').value;
        var endTimeVal = document.getElementById('endTime').value;
        
        imageObserver.disconnect();
        queue = [];
        activeWorkerCount = 0;
        loadedUrlsCache = {};
        grid.innerHTML = '';

        if (!selectedDateVal) return;

        var parts = selectedDateVal.split('-');
        var startParts = startTimeVal.split(':');
        var endParts = endTimeVal.split(':');

        var startDate = new Date(parts[0], parts[1] - 1, parts[2], parseInt(startParts[0], 10), parseInt(startParts[1], 10), 0, 0);
        var endDate = new Date(parts[0], parts[1] - 1, parts[2], parseInt(endParts[0], 10), parseInt(endParts[1], 10), 0, 0);

        if (endDate <= startDate) {
            endDate.setDate(endDate.getDate() + 1);
        }

        // עדכון רשימת הקפיצה לשעה לפי הטווח המדויק שנבחר
        updateJumpOptions(startDate, endDate);

        var totalSeconds = (endDate.getTime() - startDate.getTime()) / 1000;
        var totalSteps = Math.floor(totalSeconds / intervalSec);

        var fragment = document.createDocumentFragment();

        for (var i = 0; i < totalSteps; i++) {
            var currentTime = new Date(startDate.getTime() + (i * intervalSec * 1000));
            var secondsVal = currentTime.getSeconds();
            
            var hours = String(currentTime.getHours()).padStart(2, '0');
            var minutes = String(currentTime.getMinutes()).padStart(2, '0');
            var seconds = String(secondsVal).padStart(2, '0');
            var timeStr = hours + ':' + minutes + ':' + seconds;

            var minuteTime = new Date(currentTime.getTime() - (secondsVal * 1000));
            var diffInSeconds = Math.floor((minuteTime.getTime() - EXACT_ANCHOR_DATE.getTime()) / 1000);
            var startTime = Math.floor((EXACT_ANCHOR_TIME + (diffInSeconds * 1000)) / 1000) * 1000;

            var imgUrl = 'https://d1zqtf09wb8nt5.cloudfront.net/file/streams/oil/freetv/live/' + channel + '/live.livx/slides(id=136;startTime=' + startTime + ')';
            var frameClass = 'f-' + seconds;

            var item = document.createElement('div');
            item.className = 'item';
            item.id = 'time-' + timeStr;
            item.innerHTML = 
                '<div class="time">' + timeStr + '</div>' +
                '<a href="' + imgUrl + '" target="_blank" class="box ' + frameClass + '" data-src="' + imgUrl + '" title="לחץ לצפייה בתמונת המקור"></a>';
            
            var boxEl = item.querySelector('.box');
            imageObserver.observe(boxEl);

            fragment.appendChild(item);
        }

        grid.appendChild(fragment);
    }

    document.getElementById('loadBtn').onclick = runGrid;
    runGrid();
})();
</script>

</body>
</html>
